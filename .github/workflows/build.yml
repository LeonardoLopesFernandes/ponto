name: Build Flutter APK (arm64-v8a)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/ponto-key.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK (split arm64-v8a)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/ponto-key.jks
          KEYSTORE_PASSWORD: minhaloja123
          KEY_ALIAS: minhaloja
          KEY_PASSWORD: minhaloja123
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ponto-arm64-v8a
          path: build/app/outputs/flutter-apk/*arm64-v8a*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ponto ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/*arm64-v8a*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
